name: Agent Compute Workspace

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit containing the workspace source
        required: true
        default: main
        type: string
      runtime:
        description: Language/runtime to execute
        required: true
        default: python
        type: choice
        options: [python, node, typescript, bash, go, rust, java, c, cpp, csharp, ruby, php, perl, r, powershell]
      source_file:
        description: Repository-relative source file
        required: true
        default: examples/hello.py
        type: string
      arguments:
        description: JSON array of string arguments
        required: false
        default: '[]'
        type: string
      timeout_seconds:
        description: Execution timeout (1-1200 seconds)
        required: true
        default: '300'
        type: string

permissions:
  contents: read

concurrency:
  group: agent-compute-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout selected workspace revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Record available runtimes
        shell: bash
        run: |
          python --version
          node --version
          go version || true
          rustc --version || true
          javac -version || true
          ruby --version || true
          php --version || true
          perl --version || true
          Rscript --version || true
          gcc --version || true
          g++ --version || true
          dotnet --version || true
          pwsh --version || true
          mkdir -p results

      - name: Execute workspace source
        id: execute
        env:
          COMPUTE_RUNTIME: ${{ inputs.runtime }}
          COMPUTE_SOURCE_FILE: ${{ inputs.source_file }}
          COMPUTE_ARGUMENTS: ${{ inputs.arguments }}
          COMPUTE_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        shell: bash
        run: |
          python runner/execute-code.py \
            --runtime "$COMPUTE_RUNTIME" \
            --source-file "$COMPUTE_SOURCE_FILE" \
            --arguments "$COMPUTE_ARGUMENTS" \
            --timeout-seconds "$COMPUTE_TIMEOUT_SECONDS" \
            --output results/compute-result.json

      - name: Upload execution output and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-compute-${{ github.run_id }}
          path: results/compute-result.json
          if-no-files-found: warn
          retention-days: 7
