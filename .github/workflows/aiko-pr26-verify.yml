name: Aiko PR 26 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "workspaces/aiko-pr26-verify.py"
      - ".github/workflows/aiko-pr26-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541d13c3f8b45e8f10e21d6b45f6e3
        with:
          node-version: 20
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Execute Aiko verification matrix
        run: python workspaces/aiko-pr26-verify.py
      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiko-pr26-verification
          path: results/
          if-no-files-found: warn
          retention-days: 7
