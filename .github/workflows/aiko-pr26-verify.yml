name: Aiko PR 26 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "workspaces/aiko-pr26-verify.py"
      - ".github/workflows/aiko-pr26-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout workspace control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: control
          persist-credentials: false
      - name: Checkout verification runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: run/aiko-pr26-verify-final-20261111
          path: runner
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Execute Aiko verification matrix
        working-directory: control
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python3 ../runner/workspaces/aiko-pr26-verify.py
      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aiko-pr26-verification
          path: control/results/
          if-no-files-found: warn
          retention-days: 7
