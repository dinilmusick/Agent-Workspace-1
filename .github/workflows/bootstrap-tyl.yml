name: TYL Skipo bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-and-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
      TARGET_REPOSITORY: dinilmusick/TYL
      APP_NAME: TYL
      VISIBILITY: private
      DESCRIPTION: "TYL — Skipo application"
      BRANCH: main
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^dinilmusick/[A-Za-z0-9._-]+$ ]]
          [[ "$APP_NAME" =~ ^[A-Za-z][A-Za-z0-9_-]{1,63}$ ]]
          [[ -n "$GITHUB_TOKEN" ]]

      - name: Create repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/create_repository.py \
            --name TYL \
            --description "$DESCRIPTION" \
            --private > repo-created.txt

      - name: Scaffold from canonical Skipo
        shell: bash
        run: |
          set -euo pipefail
          bash tools/github/scaffold-skipo-app.sh "$TARGET_REPOSITORY" "$APP_NAME" "$BRANCH" > scaffold-result.txt

      - name: Upload scaffold evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tyl-skipo-scaffold-${{ github.run_id }}
          path: |
            repo-created.txt
            scaffold-result.txt
          retention-days: 7
