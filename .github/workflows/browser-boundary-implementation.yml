name: Browser Boundary Implementation Runner

on:
  push:
    paths:
      - ".github/workflows/browser-boundary-implementation.yml"

permissions:
  contents: read

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODING_REPO_TOKEN: __DOLLAR__{{ secrets.CODING_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout GutTS branch
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: e1649f918abcb8446a7fb99f4569e8cef7d46d25
          path: target/GutTS
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout Floks boundary PR
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Floks
          ref: refactor/browser-server-boundary
          path: target/Floks
          fetch-depth: 0
          persist-credentials: false

      - name: Implement GutTS
        shell: bash
        run: |
          set -euo pipefail
          cd target/GutTS
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const deps=pkg.dependencies||{}, dev=pkg.devDependencies||{}, peers=pkg.peerDependencies||{}, meta=pkg.peerDependenciesMeta||{};
          for (const name of ['@huggingface/transformers','cactus-needle']) {
            if (deps[name]) { dev[name]=deps[name]; delete deps[name]; }
            peers[name]=dev[name]; meta[name]={...(meta[name]||{}),optional:true};
          }
          pkg.dependencies=deps; pkg.devDependencies=dev; pkg.peerDependencies=peers; pkg.peerDependenciesMeta=meta;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          cat > src/browser.ts <<'EOF'
          export * from "./json/json-concepts.js";
          export * from "./strings/string-concepts.js";
          export * from "./arrays/array-concepts.js";
          export * from "./objects/object-concepts.js";
          export * from "./numbers/number-concepts.js";
          export * from "./urls/url-concepts.js";
          export * from "./engineering/index.js";
          export * from "./auth/index.js";
          EOF
          cat > tests/browser-dependency-closure.test.ts <<'EOF'
          import {describe,expect,it} from "vitest";
          import fs from "node:fs";
          import path from "node:path";
          const root=path.resolve(".");
          const forbidden=[/@aws-sdk\//,/googleapis/,/onnxruntime-node/,/cactus-needle/,/@huggingface\/transformers/,/node:(fs|path|crypto|child_process|net|http|https|os|stream)/];
          function reachable(entry:string){const seen=new Set<string>(),q=[entry];while(q.length){const f=q.pop()!;if(seen.has(f)||!fs.existsSync(f))continue;seen.add(f);const s=fs.readFileSync(f,"utf8");for(const m of s.matchAll(/(?:import|export)\s+(?:[^'"]+from\s+)?['"]([^'"]+)['"]/g)){const spec=m[1];if(!spec.startsWith("."))continue;let r=path.resolve(path.dirname(f),spec);if(!path.extname(r))r+=".js";q.push(r);}}return seen;}
          describe("GutTS browser dependency closure",()=>{
            it("browser surface excludes runtime-specific exports",()=>{const s=fs.readFileSync(path.join(root,"src/browser.ts"),"utf8");for(const x of ["./models/","./semantic-input/","./api/","./storage/","./server/"])expect(s).not.toContain(x);});
            it("model runtimes are optional peers",()=>{const p=JSON.parse(fs.readFileSync(path.join(root,"package.json"),"utf8"));for(const n of ["@huggingface/transformers","cactus-needle"]){expect(p.dependencies?.[n]).toBeUndefined();expect(p.peerDependencies?.[n]).toBeDefined();expect(p.peerDependenciesMeta?.[n]?.optional).toBe(true);}});
            it("built browser closure has no server-only references",()=>{for(const f of reachable(path.join(root,"dist/browser.js"))){const s=fs.readFileSync(f,"utf8");for(const re of forbidden)expect(s).not.toMatch(re);}});
          });
          EOF
          mkdir -p .changeset
          cat > .changeset/browser-boundary-complete.md <<'EOF'
          ---
          "@dinilmusick/gutts": patch
          ---
          Harden the explicit browser surface by isolating model runtimes as optional runtime peers and removing model, semantic-input, and API runtime exports from the browser entrypoint.
          EOF
          pnpm install --lockfile-only
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm vitest run tests/browser-dependency-closure.test.ts

      - name: Implement Floks
        shell: bash
        run: |
          set -euo pipefail
          cd target/Floks
          mkdir -p packages/contracts/src
          cat > packages/contracts/src/state-graph.ts <<'EOF'
          export type SocketType='input'|'output';
          export interface Socket{id:string;socketId?:string;portId?:string;label:string;type:SocketType;polarity?:SocketType;direction?:'INPUT'|'OUTPUT';dataType?:string;signalType?:string;offset?:{x:number;y:number};[key:string]:unknown}
          export type UniversalSocketDefinition=Socket;
          export interface NodeSocketDescriptor extends Socket{nodeId?:string}
          export interface NodeSocketsResult{inputs:NodeSocketDescriptor[];outputs:NodeSocketDescriptor[]}
          export interface GraphNode{id:string;type:string;label:string;position:{x:number;y:number};size?:{width:number;height:number};data?:Record<string,unknown>;inputs?:Socket[];outputs?:Socket[];width?:number;height?:number;positionLocked?:boolean;minimized?:boolean;name?:string;[key:string]:unknown}
          export interface GraphEdge{id:string;source:string;sourceSocket:string;target:string;targetSocket:string;label?:string;color?:string;wireType?:string;locked?:boolean;deletable?:boolean}
          export interface ViewportState{panX:number;panY:number;zoom:number}
          export interface NodeGraphConfig{minZoom?:number;maxZoom?:number;gridSize?:number;snapToGrid?:boolean;wireStyle?:'bezier'|'straight'|'step';tracingEnabled?:boolean;magneticTracesEnabled?:boolean;autoSolidify?:boolean;traceCutoffDistance?:number;ghostRoutingEnabled?:boolean;ghostScenarioCount?:number;ghostDecayMs?:number}
          export interface NodeHandleDefinition{id:string;label?:string;dataType?:string}
          export interface NodeDefinition{type:string;label?:string;inputs?:NodeHandleDefinition[];outputs?:NodeHandleDefinition[]}
          export interface Node2DSpriteSetting{spriteName?:string;iconName:string;accentColor:string;glowColor:string;[key:string]:unknown}
          export class SpaceNode{id:string;type:string;position:[number,number,number];name?:string;label?:string;width?:number;height?:number;radius?:number;active?:boolean;socketOffsets?:Record<string,{x:number;y:number}>;inputs?:Socket[];outputs?:Socket[];[key:string]:unknown;constructor(p:Partial<SpaceNode>&{id:string;type:string;position:[number,number,number]}){Object.assign(this,p);this.id=p.id;this.type=p.type;this.position=p.position}}
          export class ContainerNode extends SpaceNode{}
          export class ModuleNode extends SpaceNode{}
          export class TriggerNode extends SpaceNode{intervalBeats?:number}
          export class EffectNode extends SpaceNode{effectType?:string;compressorConfig?:{sidechainEnabled?:boolean;ratio?:number};multibandCompressorConfig?:{sidechainEnabled?:boolean};limiterConfig?:{ceiling?:number};reverbConfig?:{decayTime?:number};delayConfig?:{delayBeats?:number};saturationConfig?:{saturationType?:string}}
          export class RecorderNode extends SpaceNode{isArmed?:boolean}
          export interface GraphSettings{[key:string]:unknown}
          export interface Landmark{id:string;name:string;camera:{x:number;y:number;zoom:number}}
          export interface Trace{id:string;sourceNodeId:string;targetNodeId:string;sourceHandleId:string;targetHandleId:string;wireType:string;spatialScore:number}
          export interface NodeConnection{fromNodeId:string;toNodeId:string;fromSocketId?:string;toSocketId?:string;fromPort?:string;toPort?:string;wireType?:string}
          export interface BaseViewWindow{id:string;x:number;y:number;width:number;height:number;[key:string]:unknown}
          export interface ViewLink{id:string;sourceId:string;targetId:string;[key:string]:unknown}
          export interface SolidConnection{id:string;sourceId:string;targetId:string;[key:string]:unknown}
          export interface GhostSocketMapping{sourceSocketId:string;targetSocketId:string;wireType:string}
          export interface GhostNodeRecord{id:string;nodeType:string;label:string;position:{x:number;y:number};size:{width:number;height:number};scenarioIndex:number;sourceNodeId:string;socketMappings:GhostSocketMapping[];inputs?:Socket[];outputs?:Socket[]}
          export interface GhostTraceRecord{id:string;sourceNodeId:string;sourceSocketId:string;targetGhostNodeId:string;targetSocketId:string;wireType:string;pathD:string;scenarioIndex:number}
          export interface GhostCandidate{id:string;nodeType:string;label:string;scenarioIndex:number;score:number;sourceNodeId:string;socketMappings:GhostSocketMapping[];relativeOffset:{x:number;y:number}}
          export interface GhostInferenceOptions{scenarioCount?:number;maxSuggestionsPerNode?:number;customScorer?:(a:string,b:string)=>number}
          export interface PredictiveGhostNode{id:string;parentNodeId:string;parentSocketId:string;parentSocketPolarity:'input'|'output';parentSocketSignalType:string;parentSocketLabel:string;archetypeId:string;category:string;label:string;description:string;iconName:string;colorHex:string;badge:string;matchingSocketId:string;matchingSocketIndex?:number;spawnType:{type:string};worldPosition:[number,number,number];slotIndex:number;candidateIndex:number;totalCandidates:number;prototypeNode:SpaceNode}
          export interface PredictiveTrace{id:string;ghostNodeId:string;sourceNodeId:string;sourceHandleId:string;targetNodeId:string;targetHandleId:string;wireType:string;isFromGhostToParent:boolean;color:string}
          export interface PredictiveSelectionResult{ghostNodes:PredictiveGhostNode[];traces:PredictiveTrace[];selectedNodesWithGhosts:Map<string,PredictiveGhostNode[]>}
          export const SIGNAL_TYPES:Record<string,{colorStr:string}>={audio_stereo:{colorStr:'#00ffff'},audio_mono:{colorStr:'#38bdf8'},audio_packet:{colorStr:'#818cf8'},trigger:{colorStr:'#eab308'},midi_stream:{colorStr:'#ec4899'},midi_packet:{colorStr:'#f43f5e'},curve_stream:{colorStr:'#10b981'},curve_packet:{colorStr:'#34d399'},component:{colorStr:'#a855f7'},AUDIO:{colorStr:'#38bdf8'},MIDI:{colorStr:'#ec4899'},TRIGGER:{colorStr:'#eab308'},DATA:{colorStr:'#10b981'},DEFAULT:{colorStr:'#60a5fa'}};
          export class GraphNodeParent{static calculateConstrainedSocketOffset(node:SpaceNode,_socketId:string,isOutput:boolean,index:number,total:number,clearance=14){const w=node.width??180,h=node.height??120,c=Math.max(1,total),pitch=Math.min(40,Math.max(60,h-40)/c);return{x:isOutput?w/2+Math.max(12,clearance):-w/2-Math.max(12,clearance),y:c===1?0:-((c-1)*pitch)/2+index*pitch}}}
          export function getNodeSockets(node:SpaceNode):NodeSocketsResult{const f=(s:Socket):NodeSocketDescriptor=>({...s,socketId:s.socketId??s.id,nodeId:node.id});return{inputs:(node.inputs??[]).map(f),outputs:(node.outputs??[]).map(f)}}
          export function calculateSocketCoordinates(baseY:number,o:{cardWidth:number;cardHeight?:number;isOutput:boolean;clearance?:number;nudge?:{x:number;y:number}}){const c=Math.max(12,o.clearance??14),n=o.nudge??{x:0,y:0},w=o.cardWidth/2,b=o.isOutput?w+c:-w-c;return{baseX:b,effectiveX:b+n.x,effectiveY:baseY+n.y,nudge:n}}
          export function getBeamPoints(n:{x:number;y:number},baseW=5,headW=1.2){const vx=-n.x,vy=-n.y,d=Math.hypot(vx,vy);if(d<1)return'';const px=-vy/d,py=vx/d;return\`\${-px*headW},\${-py*headW} \${px*headW},\${py*headW} \${vx+px*baseW},\${vy+py*baseW} \${vx-px*baseW},\${vy-py*baseW}\`}
          export function describeSvgArc(cx:number,cy:number,r:number,startDeg:number,endDeg:number){const rad=(d:number)=>(d-90)*Math.PI/180,a=rad(startDeg),b=rad(endDeg),x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(b),y2=cy+r*Math.sin(b),large=Math.abs(endDeg-startDeg)<=180?'0':'1',sweep=endDeg>startDeg?'1':'0';return\`M \${x1} \${y1} A \${r} \${r} 0 \${large} \${sweep} \${x2} \${y2}\`}
          export function zoomAtPoint(mx:number,my:number,delta:number,v:ViewportState,c:NodeGraphConfig={}):ViewportState{const z=clampZoom(v.zoom+delta,c),gx=(mx-v.panX)/v.zoom,gy=(my-v.panY)/v.zoom;return{zoom:z,panX:mx-gx*z,panY:my-gy*z}}
          export function clampZoom(z:number,c:NodeGraphConfig={}):number{return Math.max(c.minZoom??.25,Math.min(c.maxZoom??2.5,z))}
          export function canvasToScreen(x:number,y:number,v:ViewportState){return{x:x*v.zoom+v.panX,y:y*v.zoom+v.panY}}
          export function isNodeInCenterDeadZone(n:GraphNode,v:ViewportState,w:number,h:number,dz=80){const p=canvasToScreen(n.position.x,n.position.y,v);return Math.abs(p.x-w/2)<dz&&Math.abs(p.y-h/2)<dz}
          export function getCenterPanForNode(n:GraphNode,v:ViewportState,w:number,h:number){const p=canvasToScreen(n.position.x,n.position.y,v);return{x:v.panX+w/2-p.x,y:v.panY+h/2-p.y}}
          export function getNodesInSelection(nodes:GraphNode[],s:{x:number;y:number;width:number;height:number},v:ViewportState){return nodes.filter(n=>{const p=canvasToScreen(n.position.x,n.position.y,v);return p.x>=s.x&&p.x<=s.x+s.width&&p.y>=s.y&&p.y<=s.y+s.height})}
          export class ConnectionRuleStore{private static types=new Map<string,NodeDefinition>();static registerNodeTypes(d:NodeDefinition[]){for(const x of d)this.types.set(x.type,x)}static listNodeTypes(){return[...this.types.values()]}static getNodeType(t:string){return this.types.get(t)}static canConnect(a:{dataType?:string},b:{dataType?:string}){const x=(a.dataType||'ANY').toUpperCase(),y=(b.dataType||'ANY').toUpperCase();return x==='ANY'||y==='ANY'||x==='*'||y==='*'||x===y}static resolve(a:{dataType?:string},b:{dataType?:string}){return{wireType:'DEFAULT',allowed:this.canConnect(a,b)}}}
          export class GhostStore{private static instance:GhostStore|null=null;public isActive=false;public ghostNodes:GhostNodeRecord[]=[];public ghostTraces:GhostTraceRecord[]=[];public scenarioIndex=0;public hoveredGhostId:string|null=null;private listeners=new Set<()=>void>();static getInstance(){return this.instance??=new GhostStore()}subscribe(f:()=>void){this.listeners.add(f);return()=>this.listeners.delete(f)}setPredictions(n:GhostNodeRecord[],t:GhostTraceRecord[]){this.ghostNodes=n;this.ghostTraces=t;this.isActive=n.length>0;this.scenarioIndex=0;this.notify()}cycleScenario(max=3){const count=Math.max(max,...this.ghostNodes.map(n=>n.scenarioIndex+1));this.scenarioIndex=(this.scenarioIndex+1)%count;this.notify()}setHoveredGhostId(id:string|null){this.hoveredGhostId=id;this.notify()}getActiveGhostNodes(){return this.ghostNodes.filter(n=>n.scenarioIndex===this.scenarioIndex)}getActiveGhostTraces(){return this.ghostTraces.filter(t=>t.scenarioIndex===this.scenarioIndex)}clear(){this.isActive=false;this.ghostNodes=[];this.ghostTraces=[];this.scenarioIndex=0;this.hoveredGhostId=null;this.notify()}private notify(){for(const f of this.listeners)f()}}
          export function inferGhostNodes(selected:GraphNode[],defs:NodeDefinition[],o:GhostInferenceOptions={}):GhostCandidate[]{const count=Math.max(1,o.scenarioCount??3),max=o.maxSuggestionsPerNode??2,out:GhostCandidate[]=[];for(const s of selected){const outputs=s.outputs??[];if(!outputs.length)continue;const scored=defs.filter(d=>d.type!==s.type).map(def=>({def,m:outputs.flatMap(x=>{const i=def.inputs?.find(y=>ConnectionRuleStore.canConnect(x,y));return i?[{sourceSocketId:x.id,targetSocketId:i.id,wireType:'DEFAULT'}]:[]})})).filter(x=>x.m.length).sort((a,b)=>b.m.length-a.m.length);for(let si=0;si<count;si++)for(const [i,x] of scored.slice(si*max,(si+1)*max).entries())out.push({id:'ghost-'+s.id+'-'+x.def.type+'-'+si+'-'+i,nodeType:x.def.type,label:x.def.label??x.def.type,scenarioIndex:si,score:x.m.length*10,sourceNodeId:s.id,socketMappings:x.m,relativeOffset:{x:260,y:i*140}})}return out}
          export function resolveGhostLayout(cs:GhostCandidate[],nodes:GraphNode[],defs:NodeDefinition[]):GhostNodeRecord[]{const map=new Map(nodes.map(n=>[n.id,n])),dm=new Map(defs.map(d=>[d.type,d])),occ=nodes.map(n=>({x:n.position.x,y:n.position.y,width:n.width??180,height:n.height??120}));return cs.map(c=>{const s=map.get(c.sourceNodeId),d=dm.get(c.nodeType),r={x:(s?.position.x??0)+(s?.width??180)+80,y:(s?.position.y??0)+c.relativeOffset.y,width:180,height:120};occ.push(r);return{id:c.id,nodeType:c.nodeType,label:c.label,position:{x:r.x,y:r.y},size:{width:r.width,height:r.height},scenarioIndex:c.scenarioIndex,sourceNodeId:c.sourceNodeId,socketMappings:c.socketMappings,inputs:(d?.inputs??[]).map(h=>({id:h.id,label:h.label??h.id,type:'input' as const,dataType:h.dataType})),outputs:(d?.outputs??[]).map(h=>({id:h.id,label:h.label??h.id,type:'output' as const,dataType:h.dataType}))}})}
          export function buildGhostTraces(gs:GhostNodeRecord[],nodes:GraphNode[]):GhostTraceRecord[]{const m=new Map(nodes.map(n=>[n.id,n])),out:GhostTraceRecord[]=[];for(const g of gs){const s=m.get(g.sourceNodeId);if(!s)continue;for(const x of g.socketMappings)out.push({id:'trace-'+g.id+'-'+x.sourceSocketId,sourceNodeId:s.id,sourceSocketId:x.sourceSocketId,targetGhostNodeId:g.id,targetSocketId:x.targetSocketId,wireType:x.wireType,scenarioIndex:g.scenarioIndex,pathD:'M '+(s.position.x+(s.width??180))+','+s.position.y+' L '+g.position.x+','+g.position.y})}return out}
          export function computePredictiveGraph(nodes:SpaceNode[],connections:NodeConnection[],scenarioIndex=0):PredictiveSelectionResult{const ghosts:PredictiveGhostNode[]=[],traces:PredictiveTrace[]=[],map=new Map<string,PredictiveGhostNode[]>();const connected=new Set(connections.map(c=>c.fromNodeId+':'+c.toNodeId));for(const p of nodes){const cs=nodes.filter(c=>c.id!==p.id&&c.type!==p.type).slice(0,2),pg:PredictiveGhostNode[]=[];cs.forEach((c,i)=>{const side=i%2===0?1:-1,id='ghost-'+p.id+'-'+c.id+'-'+scenarioIndex+'-'+i,w=SIGNAL_TYPES[signalType(c.type)]?.colorStr??SIGNAL_TYPES.DEFAULT.colorStr;if(connected.has(p.id+':'+c.id))return;const g:PredictiveGhostNode={id,parentNodeId:p.id,parentSocketId:'predictive-'+(side>0?'output':'input'),parentSocketPolarity:side>0?'output':'input',parentSocketSignalType:signalType(c.type),parentSocketLabel:side>0?'Output':'Input',archetypeId:c.type,category:'browser',label:c.label??c.name??c.type,description:'Predicted browser-safe graph continuation',iconName:c.type,colorHex:w,badge:'PREDICT',matchingSocketId:'predictive-'+(side>0?'input':'output'),spawnType:{type:c.type},worldPosition:[p.position[0]+side*5,p.position[1],p.position[2]+(i-.5)*2.6],slotIndex:i,candidateIndex:i,totalCandidates:cs.length,prototypeNode:c};pg.push(g);ghosts.push(g);traces.push({id:'ptrace-'+id,ghostNodeId:id,sourceNodeId:side>0?p.id:id,sourceHandleId:'predictive-output',targetNodeId:side>0?id:p.id,targetHandleId:'predictive-input',wireType:signalType(c.type),isFromGhostToParent:side<0,color:w})});if(pg.length)map.set(p.id,pg)}return{ghostNodes:ghosts,traces,selectedNodesWithGhosts:map}}
          function signalType(t:string){const v=t.toUpperCase();return v.includes('AUDIO')?'AUDIO':v.includes('MIDI')?'MIDI':v.includes('TRIGGER')?'TRIGGER':'DATA'}
          export class MagneticGraphManager{private threshold:number;private landmarks:Landmark[]=[];constructor(t=320){this.threshold=t}computeTraces(nodes:SpaceNode[]):Trace[]{const out:Trace[]=[];for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],d=Math.hypot(a.position[0]-b.position[0],a.position[2]-b.position[2]);if(d>this.threshold)continue;const x=getNodeSockets(a).outputs[0],y=getNodeSockets(b).inputs[0];if(x&&y)out.push({id:'trace-'+a.id+'-'+b.id,sourceNodeId:a.id,targetNodeId:b.id,sourceHandleId:x.socketId??x.id,targetHandleId:y.socketId??y.id,wireType:x.signalType??x.dataType??'DEFAULT',spatialScore:d})}return out}resolveAutoSolidification(nodes:SpaceNode[],traces:Trace[],connections:NodeConnection[]){return traces.filter(t=>!connections.some(c=>c.fromNodeId===t.sourceNodeId&&c.toNodeId===t.targetNodeId))}saveLandmark(name:string,camera:{x:number;y:number;zoom:number}){const x={id:'landmark-'+Date.now(),name,camera:{...camera}};this.landmarks=[...this.landmarks.filter(l=>l.name!==name),x];return x}getLandmarks(){return[...this.landmarks]}}
          export class GraphWireParent{id:string;signalType:string;flowSpeedMultiplier:number;constructor(p:{id:string;signalType?:string;flowSpeedMultiplier?:number}){this.id=p.id;this.signalType=p.signalType??'trigger';this.flowSpeedMultiplier=p.flowSpeedMultiplier??1}calculateCubicBezier2D(p1:{x:number;y:number},p2:{x:number;y:number}){const dx=Math.max(Math.abs(p2.x-p1.x)*.5,45),cp1={x:p1.x+dx,y:p1.y+(p2.y-p1.y)*.25},cp2={x:p2.x-dx,y:p2.y-(p2.y-p1.y)*.25};return{pathD:'M '+p1.x+','+p1.y+' C '+cp1.x+','+cp1.y+' '+cp2.x+','+cp2.y+' '+p2.x+','+p2.y,cp1,cp2}}calculatePulsePoint2D(t:number,p1:{x:number;y:number},p2:{x:number;y:number},c1:{x:number;y:number},c2:{x:number;y:number}){const u=1-t;return{x:u*u*u*p1.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*p2.x,y:u*u*u*p1.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*p2.y}}}
          export interface UIAuthoringValidation{valid:boolean;errors:string[];warnings:string[];[key:string]:unknown}
          EOF

          node <<'NODE'
          const fs=require('fs');
          const p='packages/contracts/package.json';
          const pkg=JSON.parse(fs.readFileSync(p,'utf8'));
          pkg.exports['./state-graph']={import:'./dist/state-graph.js',types:'./dist/state-graph.d.ts',default:'./dist/state-graph.js'};
          pkg.scripts.build='tsup src/index.ts src/state-graph.ts --format esm --dts --clean --external zod';
          fs.writeFileSync(p,JSON.stringify(pkg,null,2)+'\n');
          const idx='packages/contracts/src/index.ts';
          let c=fs.readFileSync(idx,'utf8');
          if(!c.includes("state-graph.js")) c+="\nexport * from './state-graph.js';\n";
          fs.writeFileSync(idx,c);
          NODE

          python3 - <<'PY'
          from pathlib import Path
          import json
          for p in Path('packages/canvas-ui').rglob('*'):
              if p.suffix not in {'.ts','.tsx'}: continue
              s=p.read_text()
              s=s.replace('@kloks/state-graph/browser/browser','@floks/contracts/state-graph')
              s=s.replace('@kloks/state-graph/browser','@floks/contracts/state-graph')
              s=s.replace('@ultrst-armada/kloks/contracts','@floks/contracts')
              s=s.replace('@kloks/state-graph','@floks/contracts/state-graph')
              p.write_text(s)
          p=Path('packages/canvas-ui/package.json'); d=json.loads(p.read_text()); d.get('dependencies',{}).pop('@kloks/state-graph',None); d['dependencies']['@floks/contracts']='workspace:*'; d['scripts']['build']=d['scripts']['build'].replace(' --external @kloks/state-graph','').replace(' --external @kloks/audio-midi',''); p.write_text(json.dumps(d,indent=2)+'\n')
