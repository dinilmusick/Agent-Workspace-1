name: Browser Boundary Refactor Workspace

on:
  push:
    paths:
      - ".github/workflows/browser-boundary-refactor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-floks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
    steps:
      - name: Checkout Floks boundary branch
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Floks
          ref: refactor/browser-server-boundary
          token: ${{ secrets.CODING_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Remove Kloks state-graph dependency from browser source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path("packages/canvas-ui/src")
          for path in root.rglob("*"):
              if path.suffix not in {".ts", ".tsx"}:
                  continue
              text = path.read_text()
              new = text.replace("@kloks/state-graph/browser/browser", "@floks/contracts")
              new = new.replace("@kloks/state-graph/browser", "@floks/contracts")
              new = new.replace("@ultrst-armada/kloks/state-graph", "@floks/contracts")
              new = new.replace("@ultrst-armada/kloks/contracts", "@floks/contracts")
              new = new.replace("@kloks/state-graph", "@floks/contracts")
              if new != text:
                  path.write_text(new)
          PY
          if grep -RInE '@(ultrst-armada/)?kloks/state-graph|@ultrst-armada/kloks|@ultrst-armada/krnl' packages/canvas-ui/src; then
            echo "Forbidden browser backend imports remain."
            exit 1
          fi
      - name: Install and verify Floks
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("packages/canvas-ui/package.json")
          data=json.loads(p.read_text())
          data.get("dependencies", {}).pop("@kloks/state-graph", None)
          p.write_text(json.dumps(data, indent=2)+"\n")
          PY
          pnpm install --no-frozen-lockfile
          pnpm --filter @floks/contracts run build
          pnpm --filter @floks/contracts run typecheck
          pnpm --filter @floks/ui run build
          pnpm --filter @floks/ui run build:types
          pnpm --filter @floks/canvas-ui run typecheck
          pnpm --filter @floks/canvas-ui run build
          pnpm test -- --run tests/browser-boundary.test.ts
      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent Workspace 1"
          git config user.email "agent-workspace-1@users.noreply.github.com"
          git add packages/canvas-ui/src packages/canvas-ui/package.json packages/contracts/src packages/contracts/package.json pnpm-lock.yaml tests/browser-boundary.test.ts
          if git diff --cached --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git commit -m "fix: replace Kloks graph imports with Floks browser contracts"
          git push origin HEAD:refactor/browser-server-boundary

  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout GutTS
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/GutTS
          ref: main
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target/GutTS
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout FrnlTS
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/FrnlTS
          ref: main
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target/FrnlTS
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Floks
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Floks
          ref: refactor/browser-server-boundary
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target/Floks
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Kloks
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Kloks
          ref: main
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target/Kloks
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Skipo
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Skipo
          ref: main
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target/Skipo
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          {
            echo "=== COMMITS ==="
            for r in GutTS FrnlTS Floks Skipo; do
              echo "--- $r ---"
              git -C "target/$r" log -5 --oneline
              git -C "target/$r" status --short --branch
            done
            echo
            echo "=== PACKAGE MANIFESTS ==="
            for f in target/GutTS/package.json target/FrnlTS/package.json target/Floks/package.json target/Floks/packages/ui/package.json target/Floks/packages/canvas-ui/package.json target/Skipo/package.json; do
              echo "--- $f ---"
              cat "$f"
            done
            echo
            echo "=== GUTTS BROWSER CLOSURE CANDIDATES ==="
            grep -RInE 'from ["'\''](\.|@aws-sdk|googleapis|node:|cactus-needle|@huggingface)' target/GutTS/src/browser.ts target/GutTS/src/api target/GutTS/src/models target/GutTS/src/semantic-input target/GutTS/src/auth 2>/dev/null || true
            echo
            echo "=== FLOKS BACKEND IMPORTS ==="
            grep -RInE '@ultrst-armada/(kloks|krnl)|@kloks/' target/Floks/packages target/Floks/src 2>/dev/null || true
            echo
            echo "=== FLOKS STATE GRAPH IMPORTS ==="
            grep -RInE '@(ultrst-armada/)?kloks/state-graph|@kloks/' target/Floks/packages/canvas-ui target/Floks/packages/contracts 2>/dev/null | head -500 || true
            echo
            echo "=== KLOKS STATE GRAPH PUBLIC EXPORTS ==="
            sed -n '1,260p' target/Kloks/packages/state-graph/src/index.ts
            echo
            echo "=== SKIPO FRONTEND BACKEND IMPORTS ==="
            grep -RInE '@ultrst-armada/(kloks|krnl)|@dinilmusick/gutts/(server|storage|models|semantic-input)|node:' target/Skipo/frontend target/Skipo/src target/Skipo/app target/Skipo 2>/dev/null | head -500 || true
            echo
            echo "=== EXISTING BOUNDARY TESTS ==="
            find target/GutTS target/FrnlTS target/Floks target/Skipo -type f \( -name '*boundary*' -o -name '*import*direction*' -o -name '*package*export*' \) -print
          } | tee results/browser-boundary-analysis.txt

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-boundary-analysis-${{ github.run_id }}
          path: results/browser-boundary-analysis.txt
          retention-days: 7

# verification refresh
