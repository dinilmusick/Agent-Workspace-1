name: Create Skipo Application Repository

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "New repository name"
        required: true
        type: string
      visibility:
        description: "Repository visibility"
        required: true
        default: private
        type: choice
        options: [private, public]
      description:
        description: "Repository description"
        required: false
        default: ""
        type: string
      app_name:
        description: "Skipo application name"
        required: true
        type: string
      branch:
        description: "Initial development branch"
        required: true
        default: main
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  create-and-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
      TARGET_REPOSITORY: dinilmusick/${{ inputs.repository || 'TYL' }}
      APP_NAME: ${{ inputs.app_name || 'TYL' }}
      VISIBILITY: ${{ inputs.visibility || 'private' }}
      DESCRIPTION: ${{ inputs.description || 'TYL — Skipo application' }}
      BRANCH: ${{ inputs.branch || 'main' }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^dinilmusick/[A-Za-z0-9._-]+$ ]] || exit 2
          [[ "$APP_NAME" =~ ^[A-Za-z][A-Za-z0-9_-]{1,63}$ ]] || exit 2
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 2
          [[ -n "$GITHUB_TOKEN" ]] || exit 2

      - name: Create repository
        shell: bash
        run: |
          set -euo pipefail
          bash tools/github/create-repository.sh "${{ inputs.repository || 'TYL' }}" "$VISIBILITY" "$DESCRIPTION" > repo-created.txt

      - name: Scaffold from canonical Skipo
        shell: bash
        run: |
          set -euo pipefail
          bash tools/github/scaffold-skipo-app.sh "$TARGET_REPOSITORY" "$APP_NAME" "$BRANCH" > scaffold-result.txt

      - name: Upload scaffold evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skipo-scaffold-${{ github.run_id }}
          path: |
            repo-created.txt
            scaffold-result.txt
          retention-days: 7
