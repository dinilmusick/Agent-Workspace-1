name: Detach Forge Snapshot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  detach:
    if: startsWith(github.event.issue.title, '[detach-forge]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Verify imported snapshot
        run: |
          test -f upstream/forge/LICENSE
          test -f upstream/forge/THIRD_PARTY_NOTICES.md
          test -f upstream/forge/crates/runtime-core/Cargo.toml
          test -f upstream/forge/src/runner/generated/runtime-core_bg.wasm

      - name: Extract detached Forge material
        run: |
          set -euo pipefail
          rm -rf embedded/forge
          mkdir -p embedded/forge/source embedded/forge/generated embedded/forge/licenses
          cp -R upstream/forge/crates/runtime-core embedded/forge/source/runtime-core
          cp -R upstream/forge/packages/contracts embedded/forge/source/contracts
          cp -R upstream/forge/packages/core embedded/forge/source/core
          cp -R upstream/forge/packages/browser embedded/forge/source/browser
          cp upstream/forge/src/runner/generated/runtime-core.js embedded/forge/generated/
          cp upstream/forge/src/runner/generated/runtime-core_bg.wasm embedded/forge/generated/
          cp upstream/forge/src/runner/generated/runtime-core.d.ts embedded/forge/generated/
          cp upstream/forge/src/runner/generated/runtime-core_bg.wasm.d.ts embedded/forge/generated/
          cp upstream/forge/src/runtime/go-stage.worker.ts embedded/forge/source/go-stage.worker.ts
          cp upstream/forge/src/runtime/runner.worker.ts embedded/forge/source/runner.worker.ts
          cp upstream/forge/LICENSE embedded/forge/licenses/FORGE-LICENSE
          cp upstream/forge/THIRD_PARTY_NOTICES.md embedded/forge/licenses/FORGE-THIRD_PARTY-NOTICES.md
          cp -R upstream/forge/licenses/. embedded/forge/licenses/
          cp upstream/forge-upstream-revision.txt embedded/forge/PROVENANCE-UPSTREAM-REVISION.txt

      - name: Snapshot published compiler assets without retaining upstream linkage
        run: |
          set -euo pipefail
          mkdir -p embedded/forge/vendor
          cd embedded/forge/vendor
          npm pack @wasm-oj/toolchain-go@0.2.0
          npm pack @wasm-oj/toolchain-rust@0.2.0
          npm pack @wasm-oj/browser@0.2.6
          npm pack @wasm-oj/core@0.2.6
          npm pack @wasm-oj/contracts@0.2.6
          for f in *.tgz; do tar -xzf "$f"; done

      - name: Record detached provenance
        run: |
          cat > embedded/forge/DETACHED-SNAPSHOT.md <<'EOF'
          # Detached Forge Snapshot

          This directory is a one-time extracted snapshot used as source material for the embedded Kloks WASM runtime.

          There is intentionally no Git submodule, Git remote, upstream sync workflow, runtime fetch, build-time fetch, or package dependency on the wasm-oj/forge Git repository.

          The upstream revision used for provenance is recorded in PROVENANCE-UPSTREAM-REVISION.txt.
          Forge and third-party license/attribution material is preserved under licenses/.

          Published npm compiler/runtime artifacts are vendored only as a one-time source/material snapshot. They are not consumed as live dependencies of this workspace.
          EOF

      - name: Remove live upstream relationship
        run: |
          rm -rf upstream
          rm -f .github/workflows/import-forge.yml

      - name: Commit detached snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: detach Forge runtime snapshot" || exit 0
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Detached Forge snapshot completed. No upstream Forge repository relationship is retained."