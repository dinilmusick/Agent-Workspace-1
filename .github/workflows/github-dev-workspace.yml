name: GitHub Development Workspace

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target owner/name"
        required: true
        type: string
      ref:
        description: "Target branch/ref"
        required: true
        default: main
        type: string
      commands:
        description: "Newline-separated shell commands executed in the target repository"
        required: true
        type: string
      push_changes:
        description: "Commit and push the resulting working tree"
        required: true
        default: false
        type: boolean
      commit_message:
        description: "Commit message when push_changes is true"
        required: false
        default: "chore: agent workspace changes"
        type: string

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TARGET_REF: ${{ inputs.ref }}
      COMMANDS: ${{ inputs.commands }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^[^/]+/[^/]+$ ]] || exit 2
          [[ -n "$COMMANDS" ]] || exit 2
          [[ -n "$CODING_REPO_TOKEN" ]] || exit 2

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare development toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd target
          corepack enable || true
          python3 --version
          node --version
          git status --short

      - name: Execute development commands
        shell: bash
        run: |
          set -euo pipefail
          cd target
          bash -eu <<'COMMANDS'
          $COMMANDS
          COMMANDS

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:$TARGET_REF"

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-dev-workspace-${{ github.run_id }}
          path: target
          retention-days: 3
          include-hidden-files: false
