name: GitHub Development Workspace

on:
  push:
    branches: [impl-push-kone-20261109]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target owner/name"
        required: true
        type: string
      ref:
        description: "Target branch/ref"
        required: true
        default: main
        type: string
      commands:
        description: "Newline-separated shell commands executed in the target repository"
        required: true
        type: string
      push_changes:
        description: "Commit and push the resulting working tree"
        required: true
        default: false
        type: boolean
      commit_message:
        description: "Commit message when push_changes is true"
        required: false
        default: "chore: agent workspace changes"
        type: string

permissions:
  contents: read

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPOSITORY: ${{ github.event_name == 'push' && 'dinilmusick/Kone' || inputs.repository }}
      TARGET_REF: ${{ github.event_name == 'push' && 'main' || inputs.ref }}
      PUSH_CHANGES: ${{ github.event_name == 'push' && 'false' || inputs.push_changes }}
      COMMIT_MESSAGE: ${{ github.event_name == 'push' && 'chore: Kone implementation push verification' || inputs.commit_message }}
      CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49
        with:
          persist-credentials: false

      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_REPOSITORY" =~ ^[^/]+/[^/]+$ ]]
          [[ -n "$CODING_REPO_TOKEN" ]]

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare development toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd target
          corepack enable || true
          python3 --version
          node --version
          git status --short

      - name: Execute Kone implementation push verification
        shell: bash
        run: |
          set -euo pipefail
          cd target
          npm install
          npm run lint
          npm test -- --reporter=verbose
          npm run build
          grep -RInE 'TODO|FIXME|XXX|Not implemented|not implemented|stub|placeholder|return null|return undefined' src server.ts scripts || true
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 -n1 sh -c 'n=$(wc -l < "$0"); [ "$n" -gt 200 ] && echo "$n $0" || true'
          PORT=4173 NODE_ENV=production node api/index.js >/tmp/kone.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/kone.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/tmp/kone-health.json; then break; fi
            sleep 1
          done
          cat /tmp/kone-health.json
          curl -fsS http://127.0.0.1:4173/ >/tmp/kone-root.html
          grep -q '<div id="root"></div>' /tmp/kone-root.html

      - name: Commit and push
        if: env.PUSH_CHANGES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:$TARGET_REF"

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-dev-workspace-${{ github.run_id }}
          path: |
            /tmp/kone.log
            /tmp/kone-health.json
          retention-days: 3
