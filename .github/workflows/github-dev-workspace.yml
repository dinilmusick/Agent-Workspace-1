name: GitHub Development Workspace

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Target owner/name"
        required: true
        type: string
      ref:
        description: "Target base branch, tag or commit"
        required: true
        default: main
        type: string
      commands:
        description: "Newline-separated shell commands executed in the target repository"
        required: true
        type: string
      push_changes:
        description: "Push changes to a new branch"
        required: true
        default: false
        type: boolean
      branch:
        description: "New branch name (required when pushing)"
        required: false
        type: string
      create_pr:
        description: "Open a PR from the new branch"
        required: true
        default: false
        type: boolean
      commit_message:
        description: "Commit message"
        required: false
        default: "chore: agent workspace changes"
        type: string
      pr_title:
        description: "Pull request title"
        required: false
        type: string
      pr_body:
        description: "Pull request description"
        required: false
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  develop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '[github-dev]') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Agent Workspace control files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve and validate request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_REPOSITORY: ${{ inputs.repository }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_COMMANDS: ${{ inputs.commands }}
          INPUT_PUSH: ${{ inputs.push_changes }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_CREATE_PR: ${{ inputs.create_pr }}
          INPUT_COMMIT_MESSAGE: ${{ inputs.commit_message }}
          INPUT_PR_TITLE: ${{ inputs.pr_title }}
          INPUT_PR_BODY: ${{ inputs.pr_body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          env = os.environ
          if env["EVENT_NAME"] == "issues":
              if not env.get("ISSUE_TITLE", "").startswith("[github-dev]"):
                  raise SystemExit("Issue title must start with [github-dev].")
              try:
                  request = json.loads(env.get("ISSUE_BODY") or "")
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Issue body must be a JSON request: {exc}")
              repository = request.get("repository", "")
              ref = request.get("ref", "main")
              commands = request.get("commands", [])
              push = request.get("push", False)
              branch = request.get("branch", "")
              create_pr = request.get("create_pr", False)
              commit_message = request.get("commit_message", "chore: agent workspace changes")
              pr_title = request.get("pr_title", "")
              pr_body = request.get("pr_body", "")
          else:
              repository = env.get("INPUT_REPOSITORY", "")
              ref = env.get("INPUT_REF", "main")
              commands = env.get("INPUT_COMMANDS", "")
              push = env.get("INPUT_PUSH", "false").lower() == "true"
              branch = env.get("INPUT_BRANCH", "")
              create_pr = env.get("INPUT_CREATE_PR", "false").lower() == "true"
              commit_message = env.get("INPUT_COMMIT_MESSAGE", "chore: agent workspace changes")
              pr_title = env.get("INPUT_PR_TITLE", "")
              pr_body = env.get("INPUT_PR_BODY", "")

          if not isinstance(push, bool) or not isinstance(create_pr, bool):
              raise SystemExit("push and create_pr must be booleans.")
          if isinstance(commands, str):
              command_text = commands.strip()
          elif isinstance(commands, list) and all(isinstance(x, str) for x in commands):
              command_text = "\\n".join(commands).strip()
          else:
              raise SystemExit("commands must be a string or an array of strings.")

          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              raise SystemExit("repository must use owner/name format.")
          if not ref or len(ref) > 200 or ref.startswith("-") or ".." in ref or any(c in ref for c in " ~^:?*[\\\\"):
              raise SystemExit("ref is invalid.")
          if not command_text or len(command_text) > 20000:
              raise SystemExit("commands must contain 1–20,000 characters.")
          if push and (not isinstance(branch, str) or not branch or len(branch) > 200 or branch.startswith(("/", "-")) or ".." in branch or "@{" in branch or branch.endswith(("/", ".")) or any(c in branch for c in " ~^:?*[\\\\"):
              raise SystemExit("A valid new branch is required when push=true.")
          if create_pr and not push:
              raise SystemExit("create_pr requires push=true.")
          if len(command_text.splitlines()) > 100:
              raise SystemExit("At most 100 command lines are allowed.")

          for key, value in (("commit_message", commit_message), ("pr_title", pr_title), ("pr_body", pr_body)):
              if not isinstance(value, str) or "\\n" in value or "\\r" in value:
                  raise SystemExit(f"{key} must be a single-line string.")

          temp = Path(os.environ["RUNNER_TEMP"]) / "agent-development-commands.sh"
          temp.write_text("#!/usr/bin/env bash\\nset -euo pipefail\\n" + command_text + "\\n", encoding="utf-8")
          temp.chmod(0o700)
          outputs = {
              "repository": repository, "ref": ref, "push": str(push).lower(),
              "branch": branch, "create_pr": str(create_pr).lower(),
              "commit_message": commit_message, "pr_title": pr_title, "pr_body": pr_body,
              "command_file": str(temp)
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              for key, value in outputs.items():
                  stream.write(f"{key}={value}\\n")
          PY

      - name: Checkout target repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare toolchain
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          corepack enable || true
          python3 --version
          node --version
          git status --short

      - name: Execute development commands
        working-directory: target
        env:
          COMMAND_FILE: ${{ steps.request.outputs.command_file }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$COMMAND_FILE" 2>&1 | tee "$GITHUB_WORKSPACE/development.log"

      - name: Commit changes locally
        if: steps.request.outputs.push == 'true'
        working-directory: target
        env:
          BRANCH: ${{ steps.request.outputs.branch }}
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
        shell: bash
        run: |
          set -euo pipefail
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit." | tee -a "$GITHUB_WORKSPACE/development.log"
            exit 1
          fi
          git commit -m "$COMMIT_MESSAGE"

      - name: Push branch
        if: steps.request.outputs.push == 'true'
        working-directory: target
        env:
          CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          BRANCH: ${{ steps.request.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$CODING_REPO_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:$BRANCH"

      - name: Open pull request
        if: steps.request.outputs.create_pr == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          BASE_REF: ${{ steps.request.outputs.ref }}
          BRANCH: ${{ steps.request.outputs.branch }}
          PR_TITLE: ${{ steps.request.outputs.pr_title }}
          PR_BODY: ${{ steps.request.outputs.pr_body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PR_TITLE" ]]; then PR_TITLE="Agent workspace: $BRANCH"; fi
          if [[ -z "$PR_BODY" ]]; then PR_BODY="Automated development workspace changes. See the workflow run and artifact for command and verification evidence."; fi
          gh pr create --base "$BASE_REF" --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY"

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-dev-workspace-${{ github.run_id }}
          path: development.log
          if-no-files-found: warn
          retention-days: 7
