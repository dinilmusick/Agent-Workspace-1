name: Private Repository and Reference Acquisition

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-acquisition-${ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.event.repository.full_name == 'dinilmusick/Agent-Workspace-1' &&
      github.event.issue.user.login == 'dinilmusick' &&
      startsWith(github.event.issue.title, '[acquire-repo] ')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout trusted acquisition controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run acquisition request validation tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools/github/acquisition/test_validate_request.py

      - name: Resolve and validate source pin and catalog authorization
        id: request
        env:
          GH_TOKEN: ${ secrets.CODING_REPO_TOKEN }}
          ISSUE_BODY: ${ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/acquisition/validate_request.py

      - name: Acquire and independently verify private destination
        env:
          GH_TOKEN: ${ secrets.CODING_REPO_TOKEN }}
          SOURCE: ${ steps.request.outputs.SOURCE }}
          TARGET: ${ steps.request.outputs.TARGET }}
          CATEGORY: ${ steps.request.outputs.CATEGORY }}
          LICENSE_ID: ${ steps.request.outputs.LICENSE_ID }}
          SOURCE_COMMIT: ${ steps.request.outputs.SOURCE_COMMIT }}
          SOURCE_DEFAULT_BRANCH: ${ steps.request.outputs.SOURCE_DEFAULT_BRANCH }}
          MODE: ${ steps.request.outputs.MODE }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/github/acquisition/acquire.py

      - name: Report acquisition result on request issue
        if: always()
        env:
          GH_TOKEN: ${ secrets.CODING_REPO_TOKEN }}
          ISSUE_NUMBER: ${ github.event.issue.number }}
          JOB_STATUS: ${ job.status }}
          RUN_URL: ${ github.server_url }}/${ github.repository }}/actions/runs/${ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          status = os.environ.get("JOB_STATUS", "unknown")
          run_url = os.environ["RUN_URL"]
          if status == "success":
              body = f"Private acquisition completed and destination verification passed.\n\nActions evidence: {run_url}\n\nThis is private research acquisition only, not commercial clearance."
          else:
              body = f"Acquisition did not complete successfully. No successful acquisition is claimed. Inspect the Actions run for the precise failure.\n\nActions evidence: {run_url}"
          payload = json.dumps({"body": body}).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/dinilmusick/Agent-Workspace-1/issues/{os.environ['ISSUE_NUMBER']}/comments",
              data=payload, method="POST",
              headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {os.environ['GH_TOKEN']}",
                       "X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"})
          with urllib.request.urlopen(request, timeout=30) as response:
              response.read()
          PY
