name: Independent Commercial Repository Acquisition

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: repository-acquisition-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  acquire:
    if: >-
      github.event.repository.full_name == 'dinilmusick/Agent-Workspace-1' &&
      github.event.issue.user.login == 'dinilmusick' &&
      startsWith(github.event.issue.title, '[acquire-repo]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout acquisition controller
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate request and commercial license metadata
        id: request
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          body = os.environ.get("ISSUE_BODY", "")
          try:
              req = json.loads(body)
          except Exception as exc:
              raise SystemExit(f"Request body must be valid JSON: {exc}")
          source = req.get("source_repository", "")
          target = req.get("target_repository", "")
          category = req.get("category", "")
          source_commit = req.get("source_commit", "")
          approval_record = req.get("approval_record", "")
          allowed = {"MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "0BSD", "Zlib", "PostgreSQL"}
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", source):
              raise SystemExit("Invalid source_repository")
          if not re.fullmatch(r"tpl-[a-z0-9]+(?:-[a-z0-9]+)*", target):
              raise SystemExit("target_repository must use tpl-kebab-case")
          if not category or len(category) > 100:
              raise SystemExit("A short category is required")
          if not re.fullmatch(r"[0-9a-f]{40}", source_commit):
              raise SystemExit("source_commit must be a full 40-character lowercase commit SHA")
          if not approval_record.startswith("https://github.com/dinilmusick/Agent-Workspace-1/"):
              raise SystemExit("approval_record must link to the workspace audit evidence")
          token = os.environ["GH_TOKEN"]
          headers = {"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28"}
          def api(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          meta = api("https://api.github.com/repos/" + source)
          if meta.get("archived"):
              raise SystemExit("Archived source repositories are not eligible")
          license_id = (meta.get("license") or {}).get("spdx_id")
          if license_id not in allowed:
              raise SystemExit(f"License not on permissive allowlist: {license_id!r}")
          if meta.get("disabled"):
              raise SystemExit("Disabled source repositories are not eligible")
          commit_meta = api("https://api.github.com/repos/" + source + "/commits/" + source_commit)
          if commit_meta.get("sha") != source_commit:
              raise SystemExit("Approved source_commit does not exist in the source repository")
          # The authorization pins a reviewed snapshot. The upstream default branch may
          # advance later; the mirror step verifies ancestry and pins that branch to this SHA.
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a") as f:
              f.write(f"source={source}\n")
              f.write(f"target={target}\n")
              f.write(f"category={category}\n")
              f.write(f"license={license_id}\n")
              f.write(f"source_commit={source_commit}\n")
              f.write(f"approval_record={approval_record}\n")
              f.write(f"description={category} independent commercial-use template; source: {source}\n")
          print(json.dumps({"source":source,"target":target,"category":category,"spdx_license":license_id,"source_commit":source_commit,"approval_record":approval_record,"archived":False}, indent=2))
          PY

      - name: Create private destination repository
        id: create
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          DESCRIPTION: ${{ steps.request.outputs.description }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/repo.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$TARGET")"
          if [[ "$status" == "200" ]]; then
            python3 - <<'PY'
          import json, os
          d=json.load(open("/tmp/repo.json"))
          expected=os.environ["TARGET"]
          if d.get("full_name","").lower() != expected.lower():
              raise SystemExit("Existing destination owner/name mismatch")
          if d.get("private") is not True or d.get("fork") is not False:
              raise SystemExit("Existing destination must be private and must not be a fork")
          print("Resuming approved mirror into existing private independent destination:", expected)
          PY
          elif [[ "$status" == "404" ]]; then
            payload="$(python3 -c 'import json,os; print(json.dumps({"name":os.environ["TARGET"].split("/",1)[1],"private":True,"auto_init":False,"description":os.environ["DESCRIPTION"]}))')"
            curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" https://api.github.com/user/repos -d "$payload" > /tmp/created.json
            python3 -c 'import json; d=json.load(open("/tmp/created.json")); print(d["full_name"]); print(d["html_url"])'
          else
            cat /tmp/repo.json >&2
            exit 1
          fi

      - name: Mirror all Git refs into independent repository
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          SOURCE: ${{ steps.request.outputs.source }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.version=HTTP/1.1 -c "http.extraheader=AUTHORIZATION: basic $auth" clone --mirror "https://github.com/$SOURCE.git" source.git
          # Pin the source default branch to the exact reviewed commit. Keep all other
          # upstream branches and tags at their fetched revisions.
          default_branch="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$SOURCE" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"default_branch\"])")"
          git -C source.git cat-file -e "$SOURCE_COMMIT^{commit}"
          git -C source.git merge-base --is-ancestor "$SOURCE_COMMIT" "refs/heads/$default_branch"
          git -C source.git update-ref "refs/heads/$default_branch" "$SOURCE_COMMIT"
          # GitHub-managed pull-request and merge-queue refs are not writable.
          while IFS= read -r ref; do
            [[ -z "$ref" ]] || git -C source.git update-ref -d "$ref"
          done < <(git -C source.git for-each-ref --format="%(refname)" refs/pull refs/merge-queue)
          git -C source.git remote remove origin
          while IFS= read -r ref; do
            [[ -z "$ref" ]] || git -C source.git update-ref -d "$ref"
          done < <(git -C source.git for-each-ref --format="%(refname)" refs/remotes/origin)
          git -C source.git remote add destination "https://github.com/$TARGET.git"
          git -C source.git -c http.version=HTTP/1.1 -c "http.extraheader=AUTHORIZATION: basic $auth" push --mirror destination
          git -C source.git remote remove destination
          while IFS= read -r ref; do
            [[ -z "$ref" ]] || git -C source.git update-ref -d "$ref"
          done < <(git -C source.git for-each-ref --format="%(refname)" refs/remotes/destination)
          test -z "$(git -C source.git remote)"

      - name: Set destination default branch
        id: default
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          SOURCE: ${{ steps.request.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$SOURCE" | python3 -c "import json,sys; print(json.load(sys.stdin)[\"default_branch\"])")"
          payload="{\"default_branch\":\"$default_branch\"}"
          curl --fail-with-body -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" "https://api.github.com/repos/$TARGET" -d "$payload" >/dev/null
          echo "Destination default branch set to $default_branch"
          echo "branch=$default_branch" >> "$GITHUB_OUTPUT"

      - name: Verify independent destination
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          SOURCE: ${{ steps.request.outputs.source }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          DEFAULT_BRANCH: ${{ steps.default.outputs.branch }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --mirror "https://github.com/$TARGET.git" verify.git
          git -C verify.git remote remove origin
          while IFS= read -r ref; do
            [[ -z "$ref" ]] || git -C verify.git update-ref -d "$ref"
          done < <(git -C verify.git for-each-ref --format="%(refname)" refs/remotes/origin)
          source_refs="$(git -C source.git for-each-ref --format='%(refname) %(objectname)' | sort)"
          target_refs="$(git -C verify.git for-each-ref --format='%(refname) %(objectname)' | sort)"
          diff -u <(printf '%s\\n' "$source_refs") <(printf '%s\\n' "$target_refs")
          test "$(git -C verify.git rev-parse "refs/heads/$DEFAULT_BRANCH")" = "$SOURCE_COMMIT"
          destination_meta="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$TARGET")"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert d.get("private") is True, "destination must remain private"; assert d.get("fork") is False, "destination must not be a fork"' "$destination_meta"
          test -z "$(git -C verify.git remote)"
          echo "Verified: all refs match; default branch equals the approved source commit; destination is private, not a fork, and the verification clone has no upstream remote."

      - name: Emit acquisition provenance record
        env:
          SOURCE: ${{ steps.request.outputs.source }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          LICENSE_ID: ${{ steps.request.outputs.license }}
          CATEGORY: ${{ steps.request.outputs.category }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          APPROVAL_RECORD: ${{ steps.request.outputs.approval_record }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Independent template acquisition"
            echo
            echo "- Category: $CATEGORY"
            echo "- Original source: https://github.com/$SOURCE"
            echo "- Exact source commit: $SOURCE_COMMIT"
            echo "- Detected repository SPDX license: $LICENSE_ID"
            echo "- Approval evidence: $APPROVAL_RECORD"
            echo "- Destination: https://github.com/$TARGET"
            echo "- Acquisition: independent mirror, private destination, no fork relationship."
            echo
            echo "Original license and third-party notices remain in the mirror. This record does not replace dependency, asset, font, model, extension or trademark obligations."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment result on request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
          TARGET: dinilmusick/${{ steps.request.outputs.target }}
          SOURCE: ${{ steps.request.outputs.source }}
          LICENSE_ID: ${{ steps.request.outputs.license }}
          SOURCE_COMMIT: ${{ steps.request.outputs.source_commit }}
          APPROVAL_RECORD: ${{ steps.request.outputs.approval_record }}
          DEFAULT_BRANCH: ${{ steps.default.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$JOB_STATUS" == "success" ]]; then
            body="Repository mirror created and refs verified: https://github.com/$TARGET\n\nSource: https://github.com/$SOURCE\nSource commit: $SOURCE_COMMIT\nSPDX metadata: $LICENSE_ID\nDefault branch: $DEFAULT_BRANCH\nApproval evidence: $APPROVAL_RECORD\n\nDestination remains private. Original notices are preserved. Re-run dependency, asset, font, model, extension and trademark checks before redistribution."
          else
            body="Acquisition workflow failed. Inspect the Actions run for the exact validation or mirror error. No successful acquisition is claimed."
          fi
          gh api --method POST "repos/dinilmusick/Agent-Workspace-1/issues/$ISSUE_NUMBER/comments" -f body="$body"
