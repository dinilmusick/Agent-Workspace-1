name: Inspect React TypeScript Repository

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      target_ref:
        description: Optional branch or tag
        required: false
        type: string
      project_path:
        description: App package path inside the repository
        required: false
        default: .
        type: string

permissions:
  contents: read

concurrency:
  group: react-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check out public target repository
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: python runner/checkout-public-repository.py --repository "$TARGET_REPOSITORY" --ref "$TARGET_REF"

      - name: Install permanent workspace toolchain
        run: npm install --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: tools/react-typescript-fullstack/node_modules/.bin/playwright install --with-deps chromium

      - name: Install target dependencies and run build/tests
        id: prepare
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py prepare --project-path "$PROJECT_PATH"

      - name: Run configured static quality checks
        id: quality
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: node tools/react-typescript-fullstack/scripts/quality-check.mjs

      - name: Start target application
        id: start
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py start --project-path "$PROJECT_PATH"

      - name: Wait for application readiness
        id: ready
        continue-on-error: true
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready. Server log:"
          cat artifacts/build/dev-server.log || true
          exit 1

      - name: Inspect rendered application and accessibility
        id: browser
        if: steps.ready.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_BASE_URL: http://127.0.0.1:4173
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser
        run: node tools/react-typescript-fullstack/scripts/inspect-browser.mjs

      - name: Upload build, quality and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-inspection-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail run if any verification stage failed
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          START: ${{ steps.start.outcome }}
          READY: ${{ steps.ready.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          printf 'prepare=%s quality=%s start=%s ready=%s browser=%s\n' "$PREPARE" "$QUALITY" "$START" "$READY" "$BROWSER"
          test "$PREPARE" = success &&
          test "$QUALITY" = success &&
          test "$START" = success &&
          test "$READY" = success &&
          test "$BROWSER" = success
