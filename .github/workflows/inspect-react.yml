name: Inspect React TypeScript Repository

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      target_ref:
        description: Optional branch or tag
        required: false
        type: string
      project_path:
        description: App package path inside the repository
        required: false
        default: .
        type: string

permissions:
  contents: read

concurrency:
  group: react-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Check out public target repository
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: python runner/checkout-public-repository.py --repository "$TARGET_REPOSITORY" --ref "$TARGET_REF"

      - name: Install permanent workspace toolchain
        run: npm ci --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and system dependencies
        run: tools/react-typescript-fullstack/node_modules/.bin/playwright install --with-deps chromium

      - name: Install target dependencies and run build/tests
        id: prepare
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py prepare --project-path "$PROJECT_PATH"

      - name: Run configured static quality checks
        id: quality
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: node tools/react-typescript-fullstack/scripts/quality-check-flat.mjs

      - name: Start target application
        id: start
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py start --project-path "$PROJECT_PATH"

      - name: Resolve target browser URL
        id: browser_url
        if: steps.start.outcome == 'success'
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          project = Path("workspaces/target") / os.environ.get("PROJECT_PATH", ".")
          manifest_path = project / ".agent-workspace" / "browser-tests.json"
          manifest = json.loads(manifest_path.read_text()) if manifest_path.is_file() else {}
          state_path = Path("artifacts/services/state.json")
          state = json.loads(state_path.read_text()) if state_path.is_file() else {}
          service_id = manifest.get("frontendServiceId", "web")
          service = state.get("services", {}).get(service_id, {})
          base_url = manifest.get("baseUrl") or (f"http://127.0.0.1:{service['port']}" if service else "http://127.0.0.1:4173")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TARGET_BASE_URL={base_url}\n")
          print(f"Browser target: {base_url}")
          PY

      - name: Wait for application readiness
        id: ready
        continue-on-error: true
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$TARGET_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready. Server log:"
          cat artifacts/build/dev-server.log || true
          exit 1

      - name: Run target API diagnostics when a manifest is provided
        id: api
        if: steps.ready.outcome == 'success' && hashFiles('workspaces/target/.agent-workspace/api-tests.json') != ''
        continue-on-error: true
        env:
          API_TEST_MANIFEST: workspaces/target/.agent-workspace/api-tests.json
          SERVICE_STATE_PATH: artifacts/services/state.json
          DEFAULT_SERVER_LOG: artifacts/build/dev-server.log
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path(os.environ["API_TEST_MANIFEST"]).read_text())
          service_id = manifest.get("serviceId", "api")
          state_path = Path(os.environ["SERVICE_STATE_PATH"])
          state = json.loads(state_path.read_text()) if state_path.is_file() else {}
          service = state.get("services", {}).get(service_id, {})
          port = service.get("port", 4173)
          base_url = manifest.get("baseUrl") or f"http://127.0.0.1:{port}"
          log_path = service.get("log") or os.environ["DEFAULT_SERVER_LOG"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"API_BASE_URL={base_url}\n")
              env.write(f"SERVER_LOG_PATH={log_path}\n")
          PY
          node tools/backend-api-diagnostics/scripts/run-api-diagnostics.mjs --manifest "$API_TEST_MANIFEST" --output artifacts/api

      - name: Inspect rendered application and accessibility
        id: browser
        if: steps.ready.outcome == 'success'
        continue-on-error: true
        env:
          TARGET_BASE_URL: ${{ env.TARGET_BASE_URL }}
          TARGET_ROOT: ${{ github.workspace }}/workspaces/target
          PROJECT_PATH: ${{ inputs.project_path }}
          BROWSER_EVIDENCE_KIND: real-target-preview
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser
        run: node tools/react-typescript-fullstack/scripts/inspect-browser.mjs

      - name: Verify target service health after inspection
        id: service_health
        if: steps.start.outcome == 'success'
        continue-on-error: true
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py status --project-path "$PROJECT_PATH"

      - name: Stop target services
        id: stop
        if: always()
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py stop --project-path "$PROJECT_PATH"

      - name: Upload build, quality and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-inspection-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail run if any verification stage failed
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          QUALITY: ${{ steps.quality.outcome }}
          START: ${{ steps.start.outcome }}
          READY: ${{ steps.ready.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          API_TESTS: ${{ steps.api.outcome }}
          STOP: ${{ steps.stop.outcome }}
          SERVICE_HEALTH: ${{ steps.service_health.outcome }}
        run: |
          printf 'prepare=%s quality=%s start=%s ready=%s api=%s browser=%s service_health=%s stop=%s\n' "$PREPARE" "$QUALITY" "$START" "$READY" "$API_TESTS" "$BROWSER" "$SERVICE_HEALTH" "$STOP"
          test "$PREPARE" = success &&
          test "$QUALITY" = success &&
          test "$START" = success &&
          test "$READY" = success &&
          test "$BROWSER" = success &&
          { test "$SERVICE_HEALTH" = success || test "$SERVICE_HEALTH" = skipped; } &&
          { test "$API_TESTS" = success || test "$API_TESTS" = skipped; } &&
          test "$STOP" = success
