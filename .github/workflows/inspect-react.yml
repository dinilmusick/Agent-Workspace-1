name: Inspect React TypeScript Repository

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      target_ref:
        description: Optional branch or tag
        required: false
        type: string
      project_path:
        description: Path to the app package inside the repository
        required: false
        default: .
        type: string

permissions:
  contents: read

concurrency:
  group: react-inspection-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Agent Workspace tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Checkout public target repository
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: python runner/checkout-public-repository.py --repository "$TARGET_REPOSITORY" --ref "$TARGET_REF"

      - name: Install target dependencies and run build/tests
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py prepare --project-path "$PROJECT_PATH"

      - name: Install Playwright inspector
        run: |
          npm ci --prefix tools/react-typescript-fullstack
          npx --prefix tools/react-typescript-fullstack playwright install --with-deps chromium

      - name: Start target application
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: python runner/react-project.py start --project-path "$PROJECT_PATH"

      - name: Wait for application readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready. Server log:"
          cat artifacts/build/dev-server.log || true
          exit 1

      - name: Inspect rendered application with Playwright
        env:
          TARGET_BASE_URL: http://127.0.0.1:4173
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/browser
        run: node tools/react-typescript-fullstack/scripts/inspect.mjs

      - name: Upload build and browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-inspection-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
