name: Kone Implementation Push Runner

on:
  push:
    branches: [impl-push-kone-20261109]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CODING_REPO_TOKEN: ${{ secrets.CODING_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout Kone
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af49 # v4.2.2
        with:
          repository: dinilmusick/Kone
          ref: main
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: kone
          fetch-depth: 0
          persist-credentials: true
      - name: Install dependencies
        working-directory: kone
        run: npm install
      - name: Baseline static scan
        working-directory: kone
        run: |
          set -euo pipefail
          printf '%s\n' '--- package ---'
          cat package.json
          printf '%s\n' '--- suspicious markers ---'
          grep -RInE 'TODO|FIXME|XXX|Not implemented|not implemented|stub|placeholder|return null|return undefined' src server.ts scripts || true
          printf '%s\n' '--- file sizes > 200 lines ---'
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 -n1 sh -c 'n=$(wc -l < "$0"); [ "$n" -gt 200 ] && echo "$n $0" || true'
      - name: Typecheck
        working-directory: kone
        run: npm run lint
      - name: Unit tests
        working-directory: kone
        run: npm test -- --reporter=verbose
      - name: Build
        working-directory: kone
        run: npm run build
      - name: Runtime smoke and API E2E
        working-directory: kone
        run: |
          set -euo pipefail
          PORT=4173 NODE_ENV=production node api/index.js > /tmp/kone-server.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true; cat /tmp/kone-server.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ > /tmp/root.html
          grep -q '<div id="root"></div>' /tmp/root.html
          printf '%s\n' 'Runtime E2E smoke passed.'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kone-implementation-push-${{ github.run_id }}
          path: |
            kone/package.json
            kone/dist
            /tmp/kone-server.log
            /tmp/health.json
          retention-days: 7
