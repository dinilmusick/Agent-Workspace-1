name: Looper Contract Tests
on:
  workflow_dispatch:
  push:
    branches: [main, feat/reusable-execution-environment]
    paths: [tools/looper/**, skills/loop-generator/**]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check tools/looper/looper.mjs
      - run: node --test tools/looper/test/looper.test.mjs
