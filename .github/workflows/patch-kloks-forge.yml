name: Patch Detached Forge Imports

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  patch:
    if: startsWith(github.event.issue.title, '[patch-kloks-forge]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kloks
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Kloks
          ref: feat/intelligent-wasm-runtime
          token: ${{ secrets.CODING_REPO_TOKEN }}
          fetch-depth: 0

      - name: Rewrite vendored imports and metadata
        run: |
          set -euo pipefail
          find packages/wasm-runtime/vendor/forge -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.d.ts' \) -print0 | while IFS= read -r -d '' f; do
            sed -i 's#"@wasm-oj/core"#"../../core/dist/index.js"#g; s#'"'"'@wasm-oj/core'"'"'#'"'"'../../core/dist/index.js'"'"'#g; s#"@wasm-oj/contracts"#"../../contracts/dist/index.js"#g; s#'"'"'@wasm-oj/contracts'"'"'#'"'"'../../contracts/dist/index.js'"'"'#g' "$f"
          done
          for f in packages/wasm-runtime/vendor/forge/{browser,core,contracts,toolchain-go,toolchain-rust}/package.json; do
            node - "$f" <<'NODE'
          const fs=require('fs'); const p=process.argv[2]; const j=JSON.parse(fs.readFileSync(p,'utf8'));
          delete j.repository; delete j.homepage; delete j.bugs;
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          NODE
          done

      - name: Verify no live Forge dependency
        run: |
          ! grep -R "@wasm-oj/\(core\|contracts\|browser\|toolchain-go\|toolchain-rust\)" packages/wasm-runtime/vendor/forge --include='*.js' --include='*.mjs' --include='*.d.ts'
          ! grep -R 'github.com/wasm-oj/forge' packages/wasm-runtime/vendor/forge --include='*.json' --include='*.js' --include='*.mjs' --include='*.d.ts'

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/wasm-runtime/vendor/forge
          git commit -m "fix: detach vendored Forge imports"
          git push origin HEAD:feat/intelligent-wasm-runtime

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Vendored Forge imports and metadata were detached from the upstream repository."