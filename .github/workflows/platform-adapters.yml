name: Validate Platform Development Adapters

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "runner/platform_adapters.py"
      - "runner/test_platform_adapters.py"
      - "skills/platform-adapters/**"
      - "skills/catalog.json"
      - "skills/tool-bindings.json"
      - "tools/platform-adapters/**"
      - "examples/platforms/**"
      - ".github/workflows/platform-adapters.yml"
  pull_request:
    branches: [main]
    paths:
      - "runner/platform_adapters.py"
      - "runner/test_platform_adapters.py"
      - "skills/platform-adapters/**"
      - "skills/catalog.json"
      - "skills/tool-bindings.json"
      - "tools/platform-adapters/**"
      - "examples/platforms/**"
      - ".github/workflows/platform-adapters.yml"

permissions:
  contents: read

jobs:
  platform-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Upgrade npm to pinned Arborist runtime
        run: npm install --global npm@12.2.1 && npm --version

      - name: Install Cloudflare Workers test runtime
        working-directory: examples/platforms/cloudflare
        run: npm install --no-audit --no-fund

      - name: Run Cloudflare Worker tests in local workerd runtime
        run: python runner/platform_adapters.py cloudflare --project-path examples/platforms/cloudflare --output-dir artifacts/platforms

      - name: Print Cloudflare Worker test diagnostics
        if: failure()
        run: cat artifacts/platforms/cloudflare/cloudflare-vitest.log || true

      - name: Build Vercel fixture locally
        run: npm run build --prefix examples/platforms/vercel

      - name: Validate Vercel project config and adapter discovery
        run: python runner/platform_adapters.py vercel --project-path examples/platforms/vercel --output-dir artifacts/platforms

      - name: Install pinned Vercel and Supabase CLIs
        run: npm install --global vercel@65.9.0 supabase@3.0.0

      - name: Verify platform CLI versions
        run: |
          vercel --version
          supabase --version

      - name: Run local Supabase migrations and pgTAP tests (Postgres only)
        env:
          SUPABASE_TELEMETRY_DISABLED: "1"
        run: python runner/platform_adapters.py supabase --project-path examples/platforms/supabase --output-dir artifacts/platforms

      - name: Run platform adapter contract tests
        run: python -m unittest discover -s runner -p "test_*.py" -v

      - name: Upload provider evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-adapter-evidence-${{ github.run_id }}
          path: artifacts/platforms/
          if-no-files-found: warn
          retention-days: 14
