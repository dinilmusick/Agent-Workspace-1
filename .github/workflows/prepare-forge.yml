name: Prepare Detached Forge Material

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  prepare:
    if: startsWith(github.event.issue.title, '[prepare-forge]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract published packages into independent vendor trees
        run: |
          set -euo pipefail
          rm -rf embedded/forge/vendor/browser embedded/forge/vendor/core embedded/forge/vendor/contracts embedded/forge/vendor/toolchain-go embedded/forge/vendor/toolchain-rust
          mkdir -p embedded/forge/vendor
          tar -xzf embedded/forge/vendor/wasm-oj-browser-0.2.6.tgz -C embedded/forge/vendor
          mv embedded/forge/vendor/package embedded/forge/vendor/browser
          tar -xzf embedded/forge/vendor/wasm-oj-core-0.2.6.tgz -C embedded/forge/vendor
          mv embedded/forge/vendor/package embedded/forge/vendor/core
          tar -xzf embedded/forge/vendor/wasm-oj-contracts-0.2.6.tgz -C embedded/forge/vendor
          mv embedded/forge/vendor/package embedded/forge/vendor/contracts
          tar -xzf embedded/forge/vendor/wasm-oj-toolchain-go-0.2.0.tgz -C embedded/forge/vendor
          mv embedded/forge/vendor/package embedded/forge/vendor/toolchain-go
          tar -xzf embedded/forge/vendor/wasm-oj-toolchain-rust-0.2.0.tgz -C embedded/forge/vendor
          mv embedded/forge/vendor/package embedded/forge/vendor/toolchain-rust

      - name: Recover complete source material from detached workspace history
        run: |
          set -euo pipefail
          git show 3a64be20c0f75ce8197ece31c5863bb5c8e8f3d4:upstream/forge/src/compiler >/dev/null 2>&1 || true
          rm -rf /tmp/forge-history
          git worktree add --detach /tmp/forge-history 3a64be20c0f75ce8197ece31c5863bb5c8e8f3d4
          mkdir -p embedded/forge/source/full
          cp -R /tmp/forge-history/upstream/forge/src/compiler embedded/forge/source/full/compiler
          cp -R /tmp/forge-history/upstream/forge/src/core embedded/forge/source/full/core
          cp -R /tmp/forge-history/upstream/forge/src/runner embedded/forge/source/full/runner
          cp -R /tmp/forge-history/upstream/forge/src/runtime embedded/forge/source/full/runtime
          rm -rf /tmp/forge-history

      - name: Record detached extraction provenance
        run: |
          cat > embedded/forge/DETACHED-MATERIAL.md <<'EOF'
          # Detached Forge Material

          This material was extracted from the already-imported Forge snapshot in this repository history.

          No submodule, remote, live upstream sync, build-time fetch, or dependency on the wasm-oj/forge Git repository is retained.

          The material is used only as vendored source/assets for the Kloks embedded runtime. Preserve the included license and attribution files when redistributing it.
          EOF

      - name: Commit material
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add embedded/forge
          git commit -m "chore: expand detached Forge runtime material"
          git push origin HEAD:main

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Detached Forge material expanded from local workspace history; no upstream Forge connection retained."