name: Private Repository CI Fallback

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Private GitHub repository owner/name or URL"
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA; blank uses the default branch"
        required: false
        type: string
      event:
        description: "act event used to execute the target workflows"
        required: false
        default: push
        type: string
      workflow:
        description: "Optional workflow filename under .github/workflows/"
        required: false
        default: ""
        type: string
      token_mode:
        description: "Expose the read-only repository token to target workflows"
        required: true
        default: workflow
        type: choice
        options:
          - workflow
          - clone-only

permissions:
  contents: read

jobs:
  run-private-repo-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TARGET_REF: ${{ inputs.ref }}
      CI_EVENT: ${{ inputs.event }}
      CI_WORKFLOW: ${{ inputs.workflow }}
      CLONE_ROOT: ${{ github.workspace }}/clones
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install act
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz -o /tmp/act.tar.gz
          echo "0191d6f1b716ebff5a66de2b87e1e346893b02add0f16b92f560296b2151fc  /tmp/act.tar.gz" | sha256sum -c -
          tar -xzf /tmp/act.tar.gz -C /tmp act
          sudo install -m 0755 /tmp/act /usr/local/bin/act
          act --version

      - name: Clone private repository
        run: bash tools/private-repo-ci/clone-private-repo.sh

      - name: Validate target workflows
        run: |
          set -euo pipefail
          repo="${TARGET_REPOSITORY#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          export CLONED_REPO="${CLONE_ROOT}/${owner}__${name}"
          bash tools/private-repo-ci/validate-workflows.sh

      - name: Execute target repository workflows
        env:
          ACT_BIN: act
          ACT_GITHUB_TOKEN: ${{ inputs.token_mode == 'workflow' && secrets.PRIVATE_REPO_TOKEN || '' }}
        run: |
          set -euo pipefail
          repo="${TARGET_REPOSITORY#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          export CLONED_REPO="${CLONE_ROOT}/${owner}__${name}"
          bash tools/private-repo-ci/run-workflows.sh

      - name: Cleanup cloned repository
        if: always()
        run: |
          bash tools/private-repo-ci/cleanup-clone.sh
          test -z "$(find "$CLONE_ROOT" -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit)"
