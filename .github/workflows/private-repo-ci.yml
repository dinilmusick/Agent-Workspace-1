name: Private Repository CI Fallback

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Private GitHub repository owner/name or URL"
        required: true
        type: string
      ref:
        description: "Branch, tag, or SHA; blank uses the default branch"
        required: false
        type: string
      event:
        description: "act event used to execute the target workflows"
        required: false
        default: push
        type: string
      workflow:
        description: "Optional workflow filename under .github/workflows/"
        required: false
        default: ""
        type: string
      token_mode:
        description: "Expose the read-only repository token to target workflows"
        required: true
        default: workflow
        type: choice
        options:
          - workflow
          - clone-only

  push:
    paths:
      - ".agent/ci-request.json"
  pull_request:
    branches: [main]
    paths:
      - ".agent/ci-request.json"

permissions:
  contents: read

jobs:
  run-private-repo-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLONE_ROOT: ${{ github.workspace }}/clones
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Load CI request
        shell: bash
        env:
          REQUEST_REPOSITORY: ${{ inputs.repository }}
          REQUEST_REF: ${{ inputs.ref }}
          REQUEST_EVENT: ${{ inputs.event }}
          REQUEST_WORKFLOW: ${{ inputs.workflow }}
          REQUEST_TOKEN_MODE: ${{ inputs.token_mode }}
        run: |
          set -euo pipefail
          if [[ -f ".agent/ci-request.json" ]]; then
            request=".agent/ci-request.json"
            test -f "$request"
            repository="$(jq -er '.repository' "$request")"
            ref="$(jq -er '.ref // ""' "$request")"
            event="$(jq -er '.event // "push"' "$request")"
            workflow="$(jq -er '.workflow // ""' "$request")"
            token_mode="$(jq -er '.token_mode // "clone-only"' "$request")"
          else
            repository="$REQUEST_REPOSITORY"
            ref="$REQUEST_REF"
            event="$REQUEST_EVENT"
            workflow="$REQUEST_WORKFLOW"
            token_mode="$REQUEST_TOKEN_MODE"
          fi
          case "$repository" in
            */*|https://github.com/*|git@github.com:*) ;;
            *) echo "Invalid repository: $repository" >&2; exit 2 ;;
          esac
          case "$token_mode" in
            clone-only|workflow) ;;
            *) echo "Invalid token_mode: $token_mode" >&2; exit 2 ;;
          esac
          {
            echo "TARGET_REPOSITORY=$repository"
            echo "TARGET_REF=$ref"
            echo "CI_EVENT=$event"
            echo "CI_WORKFLOW=$workflow"
            echo "TOKEN_MODE=$token_mode"
          } >> "$GITHUB_ENV"

      - name: Install act
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 6 --retry-delay 4 --retry-all-errors --connect-timeout 20 --max-time 180 https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz -o /tmp/act.tar.gz
          echo "0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0  /tmp/act.tar.gz" | sha256sum -c -
          tar -xzf /tmp/act.tar.gz -C /tmp act
          sudo install -m 0755 /tmp/act /usr/local/bin/act
          act --version

      - name: Clone private repository
        run: bash tools/private-repo-ci/clone-private-repo.sh

      - name: Validate target workflows
        run: |
          set -euo pipefail
          repo="${TARGET_REPOSITORY#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          export CLONED_REPO="${CLONE_ROOT}/${owner}__${name}"
          bash tools/private-repo-ci/validate-workflows.sh

      - name: Execute target repository workflows
        shell: bash
        run: |
          set -euo pipefail
          repo="${TARGET_REPOSITORY#https://github.com/}"
          repo="${repo#git@github.com:}"
          repo="${repo%.git}"
          owner="${repo%%/*}"
          name="${repo#*/}"
          export CLONED_REPO="${CLONE_ROOT}/${owner}__${name}"
          if [[ "$TOKEN_MODE" == "workflow" ]]; then
            export ACT_GITHUB_TOKEN="$PRIVATE_REPO_TOKEN"
          else
            unset ACT_GITHUB_TOKEN || true
          fi
          bash tools/private-repo-ci/run-workflows.sh

      - name: Cleanup cloned repository
        if: always()
        run: |
          bash tools/private-repo-ci/cleanup-clone.sh
          test -z "$(find "$CLONE_ROOT" -mindepth 1 -maxdepth 1 ! -name .gitkeep -print -quit)"
