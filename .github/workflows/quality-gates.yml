name: Security and Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gates-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Dependency, secret, static and container security
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install canonical toolchain
        run: npm ci --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund

      - name: Audit toolchain and sample dependencies
        run: |
          mkdir -p artifacts/security
          npm audit --prefix tools/react-typescript-fullstack --audit-level=high --json > artifacts/security/toolchain-npm-audit.json
          npm audit --prefix examples/quality-sample --audit-level=high --json > artifacts/security/sample-npm-audit.json

      - name: Install pinned Gitleaks binary
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan repository history for secrets
        run: |
          mkdir -p artifacts/security
          gitleaks git . --redact --exit-code 1 --report-format sarif --report-path artifacts/security/gitleaks.sarif

      - name: Install pinned Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567
        with:
          version: v0.76.1
          cache: true

      - name: Scan source, dependencies, secrets and configuration
        run: |
          mkdir -p artifacts/security
          trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format sarif --output artifacts/security/trivy-fs.sarif --skip-dirs .git --skip-dirs node_modules --skip-dirs artifacts .
          trivy config --severity HIGH,CRITICAL --exit-code 1 --format sarif --output artifacts/security/trivy-config.sarif examples/quality-sample

      - name: Build sample container
        run: docker build --pull --tag quality-sample:\${{ github.sha }} examples/quality-sample

      - name: Scan built container image
        run: |
          trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format sarif --output artifacts/security/trivy-image.sarif quality-sample:\${{ github.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: javascript-typescript,python
          build-mode: none
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          upload: never
          upload-database: false
          output: artifacts/codeql

      - name: Enforce CodeQL severity threshold
        run: node tools/react-typescript-fullstack/scripts/quality/sarif-gate.mjs
        env:
          CODEQL_HIGH_THRESHOLD: 7
          CODEQL_CRITICAL_THRESHOLD: 9

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-quality-reports
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Coverage, API authorization and Lighthouse budgets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/react-typescript-fullstack/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install canonical toolchain
        run: npm ci --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for Lighthouse
        run: tools/react-typescript-fullstack/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare quality target
        run: |
          mkdir -p workspaces/target
          cp -R examples/quality-sample/. workspaces/target/

      - name: Generate coverage report
        run: tools/react-typescript-fullstack/node_modules/.bin/vitest run --config tools/react-typescript-fullstack/vitest.quality.config.mjs --coverage
        env:
          QUALITY_TARGET_ROOT: workspaces/target
          QUALITY_GATES_MANIFEST: workspaces/target/.agent-workspace/quality-gates.json

      - name: Enforce coverage thresholds
        run: node tools/react-typescript-fullstack/scripts/quality/coverage-gate.mjs
        env:
          QUALITY_TARGET_ROOT: workspaces/target
          QUALITY_GATES_MANIFEST: workspaces/target/.agent-workspace/quality-gates.json

      - name: Audit target application dependencies
        run: npm audit --prefix workspaces/target --audit-level=high --json > artifacts/quality/target-npm-audit.json

      - name: Prepare target application
        run: python runner/react-project.py prepare --project-path .

      - name: Start target application
        run: python runner/react-project.py start --project-path .

      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then
              echo "Quality sample is ready."
              exit 0
            fi
            sleep 1
          done
          cat artifacts/build/dev-server.log || true
          exit 1

      - name: Run API authentication and authorization diagnostics
        run: node tools/backend-api-diagnostics/scripts/run-api-diagnostics.mjs --manifest workspaces/target/.agent-workspace/api-tests.json --output artifacts/api
        env:
          API_BASE_URL: http://127.0.0.1:4173
          SERVER_LOG_PATH: artifacts/build/dev-server.log
          QUALITY_TEST_EMAIL: qa@example.com
          QUALITY_TEST_PASSWORD: test
          QUALITY_SESSION_TOKEN: test-token
          QUALITY_VALID_AUTHORIZATION: Bearer test-token

      - name: Resolve Chromium executable
        run: |
          chrome_path="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -executable -print -quit)"
          test -n "$chrome_path"
          echo "CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Run Lighthouse performance budgets
        run: node tools/react-typescript-fullstack/scripts/quality/lighthouse-gate.mjs
        env:
          QUALITY_TARGET_ROOT: workspaces/target
          QUALITY_GATES_MANIFEST: workspaces/target/.agent-workspace/quality-gates.json
          QUALITY_BASE_URL: http://127.0.0.1:4173

      - name: Stop target application
        if: always()
        run: python runner/react-project.py stop --project-path .

      - name: Collect coverage and runtime reports
        if: always()
        run: |
          mkdir -p artifacts/coverage
          if test -d workspaces/target/artifacts/coverage; then
            cp -R workspaces/target/artifacts/coverage/. artifacts/coverage/
          fi
          mkdir -p artifacts/quality
          find artifacts -maxdepth 3 -type f -print | sort > artifacts/quality/artifact-index.txt

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: application-quality-reports
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
