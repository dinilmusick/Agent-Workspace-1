name: Seed Kloks Detached Forge Runtime

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  seed:
    if: startsWith(github.event.issue.title, '[seed-kloks-forge]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@v4

      - name: Checkout Kloks target branch
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Kloks
          ref: feat/intelligent-wasm-runtime
          token: ${{ secrets.CODING_REPO_TOKEN }}
          path: kloks
          fetch-depth: 0

      - name: Copy detached Forge material
        run: |
          set -euo pipefail
          target=kloks/packages/wasm-runtime/vendor/forge
          rm -rf "$target"
          mkdir -p "$target"
          cp -R embedded/forge/vendor/browser "$target/browser"
          cp -R embedded/forge/vendor/core "$target/core"
          cp -R embedded/forge/vendor/contracts "$target/contracts"
          cp -R embedded/forge/vendor/toolchain-go "$target/toolchain-go"
          cp -R embedded/forge/vendor/toolchain-rust "$target/toolchain-rust"
          cp -R embedded/forge/generated "$target/runtime-core"
          cp -R embedded/forge/licenses "$target/licenses"
          cp embedded/forge/PROVENANCE-UPSTREAM-REVISION.txt "$target/PROVENANCE-UPSTREAM-REVISION.txt"
          cp embedded/forge/DETACHED-SNAPSHOT.md "$target/DETACHED-SNAPSHOT.md"
          cp embedded/forge/DETACHED-MATERIAL.md "$target/DETACHED-MATERIAL.md"

      - name: Remove direct Forge npm dependencies
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p='kloks/packages/wasm-runtime/package.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          for (const key of ['@wasm-oj/browser','@wasm-oj/toolchain-go','@wasm-oj/toolchain-rust']) delete j.dependencies?.[key];
          fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
          NODE

      - name: Commit and push target branch
        working-directory: kloks
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/wasm-runtime
          git commit -m "chore: vendor detached Forge runtime material"
          git push origin feat/intelligent-wasm-runtime

      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Detached Forge runtime material was copied into Kloks without any dependency on the Forge repository."