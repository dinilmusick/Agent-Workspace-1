name: Temporary Luth Verification

on:
  issues:
    types: [opened]

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[luth-verify]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout private Luth repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dinilmusick/Luth
          ref: main
          token: ${{ secrets.LUTH_READ_TOKEN }}
          path: luth
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@1e60f620b9541dca9eab2d7f1c9c9a3c2a4f0c5 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: luth/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install Luth dependencies
        working-directory: luth
        run: pnpm install --frozen-lockfile

      - name: Run Luth verification
        working-directory: luth
        run: |
          set -o pipefail
          pnpm test
          pnpm typecheck
          pnpm verify:architecture
          pnpm verify:bundle

      - name: Cleanup private checkout
        if: always()
        run: rm -rf luth
