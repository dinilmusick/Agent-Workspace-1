name: Browser End-to-End and Visual Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install permanent browser toolchain
        run: npm ci --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: tools/react-typescript-fullstack/node_modules/.bin/playwright install --with-deps chromium

      - name: Prepare real sample application
        run: |
          mkdir -p workspaces/target
          cp -R examples/browser-sample/. workspaces/target/
          python runner/react-project.py prepare --project-path .

      - name: Test route discovery and browser tooling
        run: npm test --prefix tools/react-typescript-fullstack

      - name: Start sample application
        id: start
        run: python runner/react-project.py start --project-path .

      - name: Wait for real application readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat artifacts/build/dev-server.log || true
          exit 1

      - name: Generate controlled visual baselines
        env:
          TARGET_ROOT: workspaces/target
          BROWSER_EVIDENCE_KIND: real-sample-preview
          UPDATE_VISUAL_BASELINES: "1"
        run: node tools/react-typescript-fullstack/scripts/inspect-browser.mjs

      - name: Compare against generated visual baselines
        env:
          TARGET_ROOT: workspaces/target
          BROWSER_EVIDENCE_KIND: real-sample-preview
          UPDATE_VISUAL_BASELINES: "0"
        run: node tools/react-typescript-fullstack/scripts/inspect-browser.mjs

      - name: Stop sample application
        if: always()
        run: python runner/react-project.py stop --project-path .

      - name: Retain visual baselines and browser evidence
        if: always()
        run: |
          if test -d workspaces/target/.agent-workspace/visual-baselines; then
            mkdir -p artifacts/browser/visual-baselines
            cp -R workspaces/target/.agent-workspace/visual-baselines/. artifacts/browser/visual-baselines/
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-visual
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
