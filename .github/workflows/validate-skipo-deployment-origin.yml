name: Skipo Deployment Origin Ecosystem Validation

on:
  push:
    branches: [main]
    paths:
      - "tools/skipo-deployment-origin/**"
      - ".github/workflows/validate-skipo-deployment-origin.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      CLONE_ROOT: ${{ github.workspace }}/clones
    steps:
      - name: Checkout Agent Workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Clone canonical ecosystem repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CLONE_ROOT"
          repos=(
            Skipo GutTS Kloks Luth Aiko Depm-Engine Qwnsr-Engine
            DocuStack-Engine Srkl-Engine Fod-Engine Theta-Engine Kult-Engine Kelt-Engine
          )
          for repo in "${repos[@]}"; do
            git clone --depth=1 "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/dinilmusick/${repo}.git" "${CLONE_ROOT}/dinilmusick__${repo}"
          done

      - name: Run deterministic ecosystem validator
        id: validator
        continue-on-error: true
        run: |
          set +e
          node tools/skipo-deployment-origin/validate.mjs "${{ github.workspace }}" 2>&1 | tee /tmp/validation.txt
          status=${PIPESTATUS[0]}
          echo "status=$status" >> /tmp/validation.txt
          exit "$status"

      - name: Publish validation evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Run ${{ github.run_id }}"
            echo
            echo 'VALIDATION_OUTPUT_BEGIN'
            cat /tmp/validation.txt
            echo 'VALIDATION_OUTPUT_END'
          } > /tmp/comment.md
          gh issue comment 46 --repo "${{ github.repository }}" --body-file /tmp/comment.md
          test "${{ steps.validator.outcome }}" = "success"

      - name: Cleanup clones
        if: always()
        run: rm -rf "$CLONE_ROOT"
