name: Validate Workspace Toolchain
on:
  push:
    branches: [main, "feat/**"]
    paths: ["tools/react-typescript-fullstack/**", "tools/agent-runtimes/**", "tools/looper/**", "runner/**", ".github/workflows/validate-toolchain.yml"]
  pull_request:
    branches: [main]
    paths: ["tools/react-typescript-fullstack/**", "tools/agent-runtimes/**", "tools/looper/**", "runner/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install React TypeScript toolchain
        run: npm ci --prefix tools/react-typescript-fullstack --ignore-scripts --no-audit --no-fund
      - name: Install optional agent loop package
        run: npm ci --prefix tools/agent-runtimes --ignore-scripts --no-audit --no-fund
      - name: Install AutoHelix Python runtime
        run: python -m pip install --disable-pip-version-check -r tools/agent-runtimes/requirements.txt && autohelix --help
      - name: Validate scripts and Looper behavior
        run: |
          node --check tools/looper/looper.mjs
          node --check tools/react-typescript-fullstack/scripts/quality-check-flat.mjs
          node --check tools/react-typescript-fullstack/scripts/inspect-browser.mjs
          node --check runner/task-ledger.mjs
          node --test tools/looper/test/looper.test.mjs
      - name: Validate Python runners
        run: python -m compileall -q runner
      - name: Preserve resolved dependency locks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-toolchain-locks-${{ github.run_id }}
          path: |
            tools/react-typescript-fullstack/package-lock.json
            tools/agent-runtimes/package-lock.json
          if-no-files-found: warn
          retention-days: 14
