name: Validate Workspace

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Python syntax
        run: python -m compileall -q runner examples

      - name: Validate task manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("examples").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("version") == 1, path
              assert isinstance(data.get("command"), list), path
              assert data["command"] and all(isinstance(x, str) for x in data["command"]), path
              print(f"VALID {path}")
          PY

      - name: Runner self-test
        run: |
          python runner/execute.py --task-file examples/python-smoke.json --output results/self-test.json
          python runner/verify.py --result results/self-test.json


      - name: Validate compute request routing
        run: |
          workflow_output="$(mktemp)"
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_OUTPUT="$workflow_output" \
          INPUT_REF=main INPUT_RUNTIME=python INPUT_SOURCE_FILE=examples/hello.py \
          INPUT_ARGUMENTS='["--smoke"]' INPUT_TIMEOUT_SECONDS=30 \
          python runner/resolve-compute-request.py
          grep -q '^runtime=python        run: |
          python runner/execute-code.py --runtime python --source-file examples/hello.py --timeout-seconds 30 --output results/compute-self-test.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/compute-self-test.json").read_text())
          assert result["exit_code"] == 0, result
          assert result["error"] is None, result
          print("VALID agent compute runtime")
          PY
 "$workflow_output"
          issue_event="$(mktemp)"
          issue_output="$(mktemp)"
          python - "$issue_event" <<'PY'
          import json, sys
          from pathlib import Path
          event = {"issue": {
              "title": "[agent-compute] smoke test",
              "author_association": "OWNER",
              "body": json.dumps({"ref": "main", "runtime": "node",
                  "source_file": "examples/hello.mjs", "arguments": [], "timeout_seconds": 30})
          }}
          Path(sys.argv[1]).write_text(json.dumps(event))
          PY
          GITHUB_EVENT_NAME=issues GITHUB_EVENT_PATH="$issue_event" \
          GITHUB_OUTPUT="$issue_output" python runner/resolve-compute-request.py
          grep -q '^runtime=node        run: |
          python runner/execute-code.py --runtime python --source-file examples/hello.py --timeout-seconds 30 --output results/compute-self-test.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/compute-self-test.json").read_text())
          assert result["exit_code"] == 0, result
          assert result["error"] is None, result
          print("VALID agent compute runtime")
          PY
 "$issue_output"

      - name: Agent compute runtime self-test
        run: |
          python runner/execute-code.py --runtime python --source-file examples/hello.py --timeout-seconds 30 --output results/compute-self-test.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("results/compute-self-test.json").read_text())
          assert result["exit_code"] == 0, result
          assert result["error"] is None, result
          print("VALID agent compute runtime")
          PY
