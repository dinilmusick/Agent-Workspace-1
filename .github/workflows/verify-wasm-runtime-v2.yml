name: Verify Kloks WASM Runtime

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: startsWith(github.event.issue.title, '[verify-wasm-runtime-v2]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kloks
        uses: actions/checkout@v4
        with:
          repository: dinilmusick/Kloks
          ref: feat/intelligent-wasm-runtime
          token: ${{ secrets.CODING_REPO_TOKEN }}
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --force --no-frozen-lockfile
      - name: Build WASM runtime package
        run: pnpm --filter @kloks/wasm-runtime build
      - name: Typecheck WASM runtime package
        run: pnpm --filter @kloks/wasm-runtime typecheck
      - name: Run WASM runtime unit tests
        run: pnpm --filter @kloks/wasm-runtime test
      - name: Verify externalized vendor imports
        run: |
          grep -Fq '../vendor/forge/browser/dist/index.js' packages/wasm-runtime/dist/index.js
          grep -Fq '../vendor/forge/toolchain-go/dist/index.js' packages/wasm-runtime/dist/index.js
          ! grep -R 'github.com/wasm-oj/forge' packages/wasm-runtime --exclude-dir=.git
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo dinilmusick/Agent-Workspace-1 --comment "Focused WASM runtime verification completed."